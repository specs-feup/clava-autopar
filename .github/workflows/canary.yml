# This workflow will build a the whole project every day at midnight
# It will build the Java part and the JS part
# Every push to a branch will trigger the build
# Every pull request will trigger the build

name: CI

on:
    push:
    workflow_dispatch:

permissions:
    checks: write
    contents: read

env:
    JAVA_VERSION: 21
    NODE_VERSION: 22.x
    #CLAVA_BRANCH: PluginAndTool
    CLAVA_BRANCH: staging

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: ${{ env.JAVA_VERSION }}

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  gradle-version: current

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Install dependencies
              run: |
                  sudo apt-get install -y cmake make wget

            - name: Checkout Project
              uses: actions/checkout@v4
              with:
                  path: clava-autopar

            - name: Checkout Java Libraries Repository
              uses: actions/checkout@v4
              with:
                  repository: specs-feup/specs-java-libs
                  ref: master
                  path: specs-java-libs

            - name: Build PetitPlus JAR
              working-directory: specs-java-libs/PetitPlus
              run: gradle --no-daemon jar

            - name: Copy PetitPlus JAR
              shell: bash
              run: |
                  jar_directory="specs-java-libs/PetitPlus/build/libs"
                  destination="clava-autopar/java-binaries"

                  if [[ ! -d "$jar_directory" ]]; then
                      echo "PetitPlus JAR directory was not created: $jar_directory" >&2
                      exit 1
                  fi

                  mapfile -t petitplus_jars < <(
                      find "$jar_directory" \
                          -maxdepth 1 \
                          -type f \
                          -name '*.jar' \
                          ! -name '*-sources.jar' \
                          ! -name '*-javadoc.jar' \
                          -print
                  )

                  if [[ ${#petitplus_jars[@]} -ne 1 ]]; then
                      echo "Expected exactly one PetitPlus binary JAR, found ${#petitplus_jars[@]}." >&2
                      printf '%s\n' "${petitplus_jars[@]}" >&2
                      exit 1
                  fi

                  mkdir -p "$destination"
                  cp "${petitplus_jars[0]}" "$destination/"
                  ls -l "$destination"

            - name: Checkout Tests Repository
              uses: actions/checkout@v4
              with:
                  repository: specs-feup/specs-lara
                  sparse-checkout: "ANTAREX/AutoPar"
                  path: specs-lara

            - name: Fetch ClavaConfig.cmake
              uses: actions/checkout@v4
              with:
                  repository: specs-feup/clava
                  path: clava
                  sparse-checkout: "CMake"
                  ref: ${{env.CLAVA_BRANCH}}

            - name: Move ClavaConfig.cmake
              run: |
                  sudo mkdir -p /usr/local/lib/Clava
                  sudo mv clava/CMake/* /usr/local/lib/Clava/

            - name: Setup js workspace
              run: |
                  echo '{ "name": "SPeCS Workspace", "type": "module", "workspaces": [ "clava-autopar" ] }' > package.json
                  npm install

            # Temporarily disabled
            #- name: Lint TS Sources
            #  id: lint
            #  run: |
            #      cd clava-autopar
            #      npm run lint

            - name: Build Project
              id: build
              # TODO: Remove 'if' when existing linter errors are removed
              if: ${{ success() || (failure() && steps.lint.outcome == 'failure') }}
              run: |
                  cd clava-autopar
                  npm run build

            - name: Run Node tests
              working-directory: clava-autopar
              run: npm test -- --runInBand

            - name: Run integration test
              # TODO: Remove 'if' when build is stable
              if: ${{ success() || ( failure() && (steps.lint.outcome == 'failure' || steps.build.outcome == 'failure')) }}
              run: |
                  cmake specs-lara/ANTAREX/AutoPar/SimpleTest
                  make
